spring.application.name=order-management
server.port=8080

spring.datasource.url=jdbc:mysql://order-order-system-bsit.g.aivencloud.com:28804/order_management_db
spring.datasource.username=bsit-appdev
spring.datasource.password=bsit-appdev2027
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MyBatis config
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.pup.taguig.ordermanagement.model

# MyBatis SQL logging (debug)
logging.level.com.pup.taguig.ordermanagement.repositoryM=DEBUG
logging.level.org.mybatis=DEBUG

# Root log level
logging.level.root=INFO

# MyBatis logs
logging.level.org.apache.ibatis=DEBUG
logging.level.java.sql=DEBUG

mybatis.configuration.log-impl=org.apache.ibatis.logging.log4j2.Log4j2Impl
